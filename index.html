<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Andreas Motors - Bientôt disponible</title>
    <style>
        /* Styles de base */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0b; /* Fond sombre pour faire ressortir le doré */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            animation: fadeIn 2s ease-in-out;
        }

        /* Animation d'entrée */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Style du logo */
        .logo {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #d4af37; /* Couleur dorée */
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #cccccc;
            font-style: italic;
        }

        /* Petit badge "Soon" */
        .badge {
            display: inline-block;
            background: linear-gradient(45deg, #d4af37, #f9e29c);
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Effet de lueur en arrière-plan */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <img src="ed3ffbb8-46b0-4b45-88a4-27bddd7f0ffb.png" alt="San Andreas Motors Logo" class="logo">
        
        <h1>Ouverture Prochaine</h1>
        <p>Nos mécaniciens peaufinent les derniers détails...</p>
        
        <div class="badge">Soon™</div>
    </div>

</body>
</html>
